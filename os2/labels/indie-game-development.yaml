# Короткие имена целей для карты. НАКЛАДКА НА ВРЕМЯ МИГРАЦИИ.
#
# Зачем существует: цели в дереве написаны абзацами по 80–470 символов, в строку
# карты такое не влезает. Панель накладывает эти поля при отрисовке и НЕ запекает
# их в карточки — обратная сборка дерева остаётся точной.
#
# Когда исчезнет: при миграции `label` и `hook` переезжают в шапку карточки узла,
# а этот файл удаляется. Новые узлы получают их сразу при создании — закон 4
# в os2/CONCEPT.md, `osctl node add` без них откажет.
#
# by: dev — написано ассистентом по тексту цели, не владельцем. Он правит то,
# что не нравится; пометка снимается его словом.

by: dev

labels:
  g-0c26:
    label: Игра выпущена и заработала
    hook: Довести начатую игру до платного релиза и пройти весь путь выпуска

  g-1d84:
    label: Играемый кусок дома
    hook: Первый кусок, в который можно зайти и играть вдвоём

  g-5a7c:
    label: Игра, в которую играется
    hook: Четверо налётчиков тащат добычу телекинезом, хозяин мешает им причинно

  g-3f90:
    label: Настоящий дом и вид
    hook: Снято — вошло в узел «игра, в которую играется»

  g-c519:
    label: Тоннель, который ломает хозяин
    hook: "Собранный концепт: команда пользуется тоннелем, хозяин по улике его меняет"

  g-2b7f:
    label: Страница в Steam
    hook: Публичная страница и сохранённая регистрация на октябрьский фестиваль

  g-8a41:
    label: Внешние плейтесты
    hook: Единственный сигнал, который нельзя подкрутить себе самому

  g-7b42:
    label: Демо на фестивале
    hook: Демо квалифицировано, опубликовано и прошло октябрьский Next Fest

  g-9d16:
    label: Платный релиз
    hook: Игра продаётся в Steam и принесла реальные деньги

  g-c4af:
    label: Разбор пройденного пути
    hook: Понять, чего стоил соло-выпуск, и выбрать следующий курс

  g-37a1:
    label: Ядро старого концепта
    hook: Снято — владелец сменил концепт на более простой

  g-6b13:
    label: Две концепции на стендах
    hook: Снято — проверка самого дорогого куска, своё дело сделала

  g-8f31:
    label: Копание тоннеля
    hook: Снято вместе со старым концептом, копание вынесено отдельной ставкой

  g-4d7a:
    label: Хозяин против тоннеля
    hook: Снято вместе со старым концептом

  g-5e8c:
    label: Целый заход демо
    hook: Снято — узел будет заведён заново под новый концепт

  g-12fd:
    label: Минимальное честное демо
    hook: Снято — требовало обещаний до того, как появилась сама игра

